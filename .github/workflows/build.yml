name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Compila
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Errori
        if: failure()
        run: grep -E "^e: " build.log || echo "Nessun errore Kotlin: controlla il log completo"

      - name: Prepara APK
        run: cp app/build/outputs/apk/release/app-release.apk Vetro-${{ github.run_number }}.apk

      - name: Pubblica APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vetro build ${{ github.run_number }}
          files: Vetro-${{ github.run_number }}.apk
          make_latest: true
